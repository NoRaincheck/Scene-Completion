[project]
name = "scene-completion"
version = "2.0.0"
description = "A naive Python implementation of Local Context Matching from 'Scene Completion Using Millions of Photographs' (Hays & Efros)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "crn" }]
requires-python = ">=3.10"
keywords = ["scene-completion", "computer-vision", "opencv", "image-inpainting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
]

[project.scripts]
scene-complete = "local_context_matching:main"
[dependency-groups]
dev = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "pytest>=8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["local_context_matching.py"]
sources = ["."]

[tool.pytest.ini_options]
markers = ["slow: integration tests that run the full pipeline"]
